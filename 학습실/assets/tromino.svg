<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350"><rect width="900" height="350" rx="18" fill="#f7f2ea"/><g font-family="Noto Sans KR,sans-serif" fill="#31272b"><text x="32" y="39" font-size="22" font-weight="700">구멍 하나 → 네 사분면에 구멍 하나씩</text><rect x="40" y="70" width="60" height="60" fill="#382d32" stroke="#ab9c96"/><rect x="100" y="70" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="160" y="70" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="220" y="70" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="40" y="130" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="100" y="130" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="160" y="130" width="60" height="60" fill="#8c344d" stroke="#ab9c96"/><rect x="220" y="130" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="40" y="190" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="100" y="190" width="60" height="60" fill="#8c344d" stroke="#ab9c96"/><rect x="160" y="190" width="60" height="60" fill="#8c344d" stroke="#ab9c96"/><rect x="220" y="190" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="40" y="250" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="100" y="250" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="160" y="250" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><rect x="220" y="250" width="60" height="60" fill="#fffcf7" stroke="#ab9c96"/><path d="M160 68V312 M38 190H282" stroke="#31272b" stroke-width="4" stroke-dasharray="7 4"/><text x="70" y="106" text-anchor="middle" fill="white" font-size="18">×</text><text x="340" y="100" font-size="19">× 원래 빠진 한 칸: 왼쪽 위 사분면</text><rect x="340" y="129" width="22" height="22" fill="#8c344d"/><text x="375" y="148" font-size="19">중앙 L자: 나머지 세 사분면에 한 칸씩</text><text x="340" y="200" font-size="19">네 사분면 모두 사용할 수 없는 칸이 하나다.</text><text x="340" y="240" font-size="19">각 2×2의 남은 세 칸을 L자 하나로 덮는다.</text><text x="340" y="285" font-size="20" font-weight="700">총 타일: 중앙 1 + 사분면 4 = 5</text></g></svg>