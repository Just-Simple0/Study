<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img"><title>tiling 학습 도식</title><rect width="100%" height="100%" fill="#fffaf3"/><g font-family="Noto Sans KR, sans-serif"><text x="210" y="35" text-anchor="middle" font-size="23" fill="#302725">세로 한 개: 남은 폭 n−1</text><text x="610" y="35" text-anchor="middle" font-size="23" fill="#302725">가로 두 개: 남은 폭 n−2</text><rect x="55" y="80" width="60" height="130" rx="8" fill="#f0ddd2" stroke="#822f43" stroke-width="2"/><text x="85.0" y="153.0" text-anchor="middle" font-size="22" fill="#302725">1</text><rect x="125" y="80" width="230" height="130" rx="8" fill="#fffaf3" stroke="#822f43" stroke-width="2"/><text x="240.0" y="153.0" text-anchor="middle" font-size="22" fill="#302725">남은 부분</text><rect x="440" y="80" width="120" height="60" rx="8" fill="#f0ddd2" stroke="#822f43" stroke-width="2"/><text x="500.0" y="118.0" text-anchor="middle" font-size="22" fill="#302725">2</text><rect x="440" y="150" width="120" height="60" rx="8" fill="#f0ddd2" stroke="#822f43" stroke-width="2"/><text x="500.0" y="188.0" text-anchor="middle" font-size="22" fill="#302725">2</text><rect x="570" y="80" width="190" height="130" rx="8" fill="#fffaf3" stroke="#822f43" stroke-width="2"/><text x="665.0" y="153.0" text-anchor="middle" font-size="22" fill="#302725">남은 부분</text><text x="400" y="270" text-anchor="middle" font-size="28" fill="#302725">F(n) = F(n−1) + F(n−2)</text></g></svg>